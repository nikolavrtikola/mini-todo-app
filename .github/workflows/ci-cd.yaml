name: Todo App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# Global environment variables
# ============================================================

env:
  REGISTRY: ghcr.io

  FRONTEND_IMAGE: ${{ github.repository_owner }}/mini-todo-frontend
  BACKEND_IMAGE: ${{ github.repository_owner }}/mini-todo-backend


# ============================================================
# CI - Validate the application
# ============================================================

jobs:

  test:
    name: Validate application

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js for backend
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci


      # --------------------------------------------------------
      # Check backend JavaScript syntax
      # --------------------------------------------------------

      - name: Validate backend
        working-directory: backend
        run: node --check server.js


      # --------------------------------------------------------
      # Validate frontend files
      # --------------------------------------------------------

      - name: Validate frontend
        run: |
          test -f frontend/index.html
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile


      # --------------------------------------------------------
      # Validate Dockerfiles
      # --------------------------------------------------------

      - name: Validate Dockerfiles
        run: |
          test -f frontend/Dockerfile
          test -f backend/Dockerfile


# ============================================================
# Build and push Docker images
# ============================================================

  build:
    name: Build and push Docker images

    needs: test

    # Only build/push when code is actually pushed to main.
    # Pull requests only execute the test job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build frontend Docker image
      # --------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend


      # --------------------------------------------------------
      # Push frontend Docker image
      # --------------------------------------------------------

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}


      # --------------------------------------------------------
      # Build backend Docker image
      # --------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend


      # --------------------------------------------------------
      # Push backend Docker image
      # --------------------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}


# ============================================================
# CD - Deploy to local Minikube
# ============================================================

  deploy:
    name: Deploy to Minikube

    needs: build

    # This runner must be installed on your Windows machine
    # where Minikube is running.
    runs-on:
      - self-hosted
      - linux

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Verify Minikube
      # --------------------------------------------------------

      - name: Check Minikube
        
        run: |
          minikube status


      # --------------------------------------------------------
      # Verify Kubernetes
      # --------------------------------------------------------

      - name: Check Kubernetes
        
        run: |
          kubectl get nodes


      # --------------------------------------------------------
      # Verify Helm
      # --------------------------------------------------------

      - name: Check Helm
        
        run: |
          helm version


      # --------------------------------------------------------
      # Login to GHCR
      # --------------------------------------------------------

        #   - name: Login to GHCR
            
        #     run: |
        #       echo "${{ secrets.GHCR_TOKEN }}" |
        #         docker login ghcr.io `
        #           -u "${{ github.actor }}" `
        #           --password-stdin


      # --------------------------------------------------------
      # Deploy application with Helm
      # --------------------------------------------------------

      - name: Deploy with Helm
        
        run: |
          helm upgrade --install mini-todo-release \
            ./mini-todo-chart \
            --namespace default \
            --set frontend.image.repository=ghcr.io/${{ github.repository_owner }}/mini-todo-frontend \
            --set frontend.image.tag=${{ github.sha }} `
            --set backend.image.repository=ghcr.io/${{ github.repository_owner }}/mini-todo-backend \
            --set backend.image.tag=${{ github.sha }}


      # --------------------------------------------------------
      # Wait for backend
      # --------------------------------------------------------

      - name: Wait for backend
        
        run: |
          kubectl rollout status `
            deployment/mini-todo-release-backend `
            --timeout=180s


      # --------------------------------------------------------
      # Wait for frontend
      # --------------------------------------------------------

      - name: Wait for frontend
        
        run: |
          kubectl rollout status `
            deployment/mini-todo-release-frontend `
            --timeout=180s


      # --------------------------------------------------------
      # Show pods
      # --------------------------------------------------------

      - name: Show pods
        
        run: |
          kubectl get pods -o wide


      # --------------------------------------------------------
      # Show services
      # --------------------------------------------------------

      - name: Show services
        
        run: |
          kubectl get svc


      # --------------------------------------------------------
      # Deployment completed
      # --------------------------------------------------------

      - name: Deployment successful
        
        run: |
          Write-Host "========================================="
          Write-Host "Todo application deployed successfully!"
          Write-Host "========================================="