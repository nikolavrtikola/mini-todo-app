name: Todo App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ${{ github.repository_owner }}/mini-todo-frontend
  IMAGE_BACKEND: ${{ github.repository_owner }}/mini-todo-backend

jobs:

  # ============================================================
  # CI - TEST
  # ============================================================

  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Frontend
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # -------------------------
      # Backend
      # -------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test


  # ============================================================
  # CI - BUILD AND PUSH DOCKER IMAGES
  # ============================================================

  build:
    name: Build and push Docker images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Frontend image
      # -------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t $REGISTRY/${IMAGE_FRONTEND}:${GITHUB_SHA} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            $REGISTRY/${IMAGE_FRONTEND}:${GITHUB_SHA}

      # -------------------------
      # Backend image
      # -------------------------

      - name: Build backend image
        run: |
          docker build \
            -t $REGISTRY/${IMAGE_BACKEND}:${GITHUB_SHA} \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            $REGISTRY/${IMAGE_BACKEND}:${GITHUB_SHA}

      # -------------------------
      # Latest tags
      # -------------------------

      - name: Tag frontend as latest
        run: |
          docker tag \
            $REGISTRY/${IMAGE_FRONTEND}:${GITHUB_SHA} \
            $REGISTRY/${IMAGE_FRONTEND}:latest

      - name: Push frontend latest
        run: |
          docker push \
            $REGISTRY/${IMAGE_FRONTEND}:latest

      - name: Tag backend as latest
        run: |
          docker tag \
            $REGISTRY/${IMAGE_BACKEND}:${GITHUB_SHA} \
            $REGISTRY/${IMAGE_BACKEND}:latest

      - name: Push backend latest
        run: |
          docker push \
            $REGISTRY/${IMAGE_BACKEND}:latest


  # ============================================================
  # CD - DEPLOY TO LOCAL MINIKUBE
  # ============================================================

  deploy:
    name: Deploy to Minikube
    needs: build

    runs-on: [self-hosted, windows]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Minikube
        shell: powershell
        run: |
          minikube status

      - name: Check Kubernetes
        shell: powershell
        run: |
          kubectl get nodes

      - name: Check Helm
        shell: powershell
        run: |
          helm version

      # ------------------------------------------------
      # Login to GHCR
      # ------------------------------------------------

      - name: Login to GHCR
        shell: powershell
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" |
            docker login ghcr.io `
              -u "${{ github.actor }}" `
              --password-stdin

      # ------------------------------------------------
      # Deploy
      # ------------------------------------------------

      - name: Helm upgrade
        shell: powershell
        run: |
          helm upgrade --install mini-todo-release `
            ./mini-todo-chart `
            --namespace default `
            --set frontend.image.repository=ghcr.io/${{ github.repository_owner }}/mini-todo-frontend `
            --set frontend.image.tag=${{ github.sha }} `
            --set backend.image.repository=ghcr.io/${{ github.repository_owner }}/mini-todo-backend `
            --set backend.image.tag=${{ github.sha }}

      # ------------------------------------------------
      # Wait for deployment
      # ------------------------------------------------

      - name: Wait for frontend
        shell: powershell
        run: |
          kubectl rollout status deployment/mini-todo-release-frontend `
            --timeout=180s

      - name: Wait for backend
        shell: powershell
        run: |
          kubectl rollout status deployment/mini-todo-release-backend `
            --timeout=180s

      # ------------------------------------------------
      # Verify
      # ------------------------------------------------

      - name: Check pods
        shell: powershell
        run: |
          kubectl get pods

      - name: Check services
        shell: powershell
        run: |
          kubectl get svc