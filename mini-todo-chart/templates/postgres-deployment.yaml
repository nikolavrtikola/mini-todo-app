apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres

    spec:
      containers:
        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"

          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          ports:
            - containerPort: 5432

  env:
  - name: POSTGRES_DB
    value: {{ .Values.postgres.database.name | quote }}

  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: {{ .Values.postgres.database.existingSecret }}
        key: POSTGRES_USER

  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ .Values.postgres.database.existingSecret }}
        key: POSTGRES_PASSWORD