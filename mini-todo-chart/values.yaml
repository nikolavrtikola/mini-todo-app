frontend:
  replicaCount: 1

  image:
    repository: mini-todo-frontend
    tag: "1.0"
    pullPolicy: Never

  service:
    type: NodePort
    port: 80
    nodePort: 30081


backend:
  replicaCount: 1

  image:
    repository: mini-todo-backend
    tag: "1.0"
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 3000


postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  database:
    name: todo
    user: postgres
    password: postgres